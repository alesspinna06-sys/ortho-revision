# Publie une nouvelle version : à chaque étiquette « vX.Y.Z », GitHub fabrique l'application Mac
# (Intel et Apple Silicon, .dmg + .zip) et la dépose dans « Releases ».
# Le logiciel installé la trouve tout seul et se remplace après un clic (sans certificat Apple).
name: Publier une version
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx vite build
      - run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
